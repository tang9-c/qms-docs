name: Sealos 静态站点镜像

on:
  push:
    branches: [codex/sealos-migration]
    paths:
      - docs/**
      - package.json
      - package-lock.json
      - deploy/sealos/**
      - .github/workflows/sealos-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sealos-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/tang9-c/qms-docs
      SMOKE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建静态站点
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sealos/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/tang9-c/qms-docs
            org.opencontainers.image.revision=${{ github.sha }}
      - name: 验证非root静态服务与深层路由
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name qms-docs-smoke --network none --read-only --tmpfs /tmp "$IMAGE:$GITHUB_SHA"
          trap 'docker stop qms-docs-smoke >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if docker exec qms-docs-smoke wget -q -O /dev/null "$SMOKE_URL/healthz"; then break; fi
            sleep 1
          done
          test "$(docker exec qms-docs-smoke id -u)" = 101
          for path in / /fmea/ /en/ /en/fmea/ /fmea/getting-started/quick-start /fmea/getting-started/quick-start.html /en/fmea/getting-started/quick-start /images/logo.png; do
            docker exec qms-docs-smoke wget -q -O /dev/null "$SMOKE_URL$path"
          done
          (docker exec qms-docs-smoke wget -S -O /dev/null "$SMOKE_URL/migration-missing-page" 2>&1 || true) | grep '404 Not Found'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送已验证镜像
        run: docker push "$IMAGE:$GITHUB_SHA"
